<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Produtos</title>
  <!-- sua colega vai trabalhar neste arquivo -->
  <link rel="stylesheet" href="/front/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Sistema de Gestão de Produtos</h1>
      <nav>
        <button @click="aba = 'produtos'" :class="{ ativo: aba === 'produtos' }">
          Produtos
        </button>
        <button @click="aba = 'relatorio'" :class="{ ativo: aba === 'relatorio' }">
          Relatório
        </button>
      </nav>
    </header>

    <main>
      <p v-if="erro" class="erro">{{ erro }}</p>
      <section v-show="aba === 'produtos'">
        <produto-form @criado="carregar"></produto-form>
        <p v-if="carregando">Carregando produtos...</p>
        <produto-list
  :produtos="produtosCompletos"
  @vender="venderProduto"
  @deletar="deletarProduto"
  @adicionar-estoque="adicionarEstoque">
</produto-list>
      </section>
      <section v-if="aba === 'relatorio'">
        <relatorio-view></relatorio-view>
      </section>
    </main>
  </div>

  <template id="template-produto-form">
    <form class="produto-form" @submit.prevent="salvar">
      <h2>Novo Produto</h2>

      <label>
        Nome
        <input v-model="produto.nome" required />
      </label>

      <label>
        Preço (R$)
        <input v-model.number="produto.preco" type="number" min="0" step="1" required />
      </label>

      <label>
        Quantidade em estoque
        <input v-model.number="produto.qtd" type="number" min="0" step="1" required />
      </label>

      <label class="checkbox">
        <input type="checkbox" v-model="produto.ehEletronico" />
        É um eletrônico?
      </label>

      <template v-if="produto.ehEletronico">
        <label>Marca <input v-model="produto.marca" /></label>
        <label>Modelo <input v-model="produto.modelo" /></label>

        <label>
          Subtipo
          <select v-model="produto.subtipo">
            <option value="">— nenhum —</option>
            <option value="domestico">Doméstico</option>
            <option value="industrial">Industrial</option>
            <option value="inteligente">Inteligente</option>
          </select>
        </label>

        <template v-if="produto.subtipo === 'domestico'">
          <label>Cor <input v-model="produto.cor" /></label>
          <label>Material <input v-model="produto.material" /></label>
        </template>

        <template v-if="produto.subtipo === 'industrial'">
          <label>Nicho <input v-model="produto.nicho" /></label>
          <label>Material <input v-model="produto.material" /></label>
        </template>

        <template v-if="produto.subtipo === 'inteligente'">
          <label class="checkbox">
            <input type="checkbox" v-model="produto.conectividade" />
            Possui conectividade
          </label>
        </template>
      </template>

      <p v-if="erro" class="erro">{{ erro }}</p>

      <button type="submit" :disabled="salvando">
        {{ salvando ? 'Salvando...' : 'Cadastrar' }}
      </button>
    </form>
  </template>

  <template id="template-produto-list">
    <div class="produto-list">
        <h2>Produtos cadastrados</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Tipo</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Detalhes</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="p in produtos" :key="p.id">
              <td>{{ p.id }}</td>
              <td>{{ p.nome }}</td>
              <td>{{ tipo(p) }}</td>
              <td>{{ moeda(p.preco) }}</td>
              <td>{{ p.qtd }}</td>
              <td>{{ detalhes(p) }}</td>
              <td class="acoes-celula">
  <button @click="$emit('vender', p)">Vender</button>
  <button class="perigo" @click="$emit('deletar', p)">Excluir</button>
</td>
            </tr>
            <tr v-if="produtos.length === 0">
              <td colspan="7" class="vazio">Nenhum produto cadastrado ainda.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </template>

    
<template id="template-relatorio-view">
  <div class="relatorio-dashboard">

    <!-- CABEÇALHO -->
    <div class="relatorio-header">
      <div>
        <h2>Relatório de desempenho</h2>
        <p>Resumo geral do catálogo e das vendas</p>
        <span v-if="dataGeracao" class="data-geracao">
          Atualizado em {{ dataGeracao }}
        </span>
      </div>

      <div class="relatorio-acoes">
        <button @click="gerar" :disabled="carregando">
          {{ carregando ? 'Atualizando...' : 'Atualizar' }}
        </button>

        <button class="btn-exportar" @click="exportarPDF">
          Exportar PDF
        </button>
      </div>
    </div>

    <!-- ERRO -->
    <p v-if="erro" class="erro">
      {{ erro }}
    </p>

    <!-- CARREGANDO -->
    <div v-if="carregando" class="relatorio-loading">
      Carregando dados do relatório...
    </div>

    <template v-else>

      <!-- INDICADORES -->
      <div class="relatorio-cards">

        <div class="relatorio-card">
          <div class="card-info">
            <span class="card-titulo">Produtos cadastrados</span>
            <strong>{{ totalProdutos }}</strong>
            <span class="card-descricao">Total no catálogo</span>
          </div>
          <div class="card-icone azul">📦</div>
        </div>

        <div class="relatorio-card">
          <div class="card-info">
            <span class="card-titulo">Faturamento total</span>
            <strong>{{ moeda(faturamento) }}</strong>
            <span class="card-descricao">Vendas registradas</span>
          </div>
          <div class="card-icone verde">💰</div>
        </div>

        <div class="relatorio-card">
          <div class="card-info">
            <span class="card-titulo">Unidades vendidas</span>
            <strong>{{ totalUnidadesVendidas }}</strong>
            <span class="card-descricao">Total de unidades</span>
          </div>
          <div class="card-icone roxo">📈</div>
        </div>

        <div class="relatorio-card">
          <div class="card-info">
            <span class="card-titulo">Produtos eletrônicos</span>
            <strong>{{ totalEletronicos }}</strong>
            <span class="card-descricao">Itens eletrônicos</span>
          </div>
          <div class="card-icone laranja">💻</div>
        </div>

      </div>

      <!-- CONTEÚDO PRINCIPAL -->
      <div class="relatorio-grid">

        <!-- PRODUTO MAIS VENDIDO -->
        <div class="relatorio-bloco destaque-produto">
          <h3>Produto mais vendido</h3>

          <div v-if="maisVendido && maisVendido.nome" class="produto-destaque">
            <div class="produto-destaque-icone">🏆</div>

            <div>
              <h4>{{ maisVendido.nome }}</h4>
              <p>ID do produto: {{ maisVendido.id }}</p>
            </div>
          </div>

          <div v-if="maisVendido && maisVendido.nome" class="produto-metricas">
            <div>
              <span>Unidades vendidas</span>
              <strong>{{ maisVendido.total_vendido }}</strong>
            </div>

            <div>
              <span>Faturamento gerado</span>
              <strong>{{ moeda(maisVendido.faturamento) }}</strong>
            </div>
          </div>

          <p v-else class="relatorio-vazio">
            Nenhuma venda registrada.
          </p>
        </div>

        <!-- RESUMO ELETRÔNICOS -->
        <div class="relatorio-bloco">
          <h3>Resumo de eletrônicos</h3>

          <div class="eletronicos-lista">
            <div class="eletronico-item">
              <span>Domésticos</span>
              <strong>{{ totalDomesticos }}</strong>
            </div>

            <div class="eletronico-item">
              <span>Industriais</span>
              <strong>{{ totalIndustriais }}</strong>
            </div>

            <div class="eletronico-item">
              <span>Inteligentes</span>
              <strong>{{ totalInteligentes }}</strong>
            </div>
          </div>
        </div>

      </div>

      <!-- VENDAS POR PRODUTO -->
      <div class="relatorio-bloco tabela-relatorio">
        <div class="bloco-header">
          <div>
            <h3>Vendas por produto</h3>
            <p>Desempenho individual dos produtos</p>
          </div>
        </div>

        <div class="tabela-scroll">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Unidades vendidas</th>
                <th>Faturamento</th>
              </tr>
            </thead>

            <tbody>
              <tr v-for="v in vendasPorProduto" :key="v.id">
                <td>{{ v.nome }}</td>
                <td>{{ v.total_vendido }}</td>
                <td>{{ moeda(v.faturamento) }}</td>
              </tr>

              <tr v-if="vendasPorProduto.length === 0">
                <td colspan="3" class="relatorio-vazio">
                  Nenhuma venda registrada.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- MOVIMENTAÇÕES -->
      <div class="relatorio-bloco tabela-relatorio">
        <div class="bloco-header">
          <div>
            <h3>Movimentações do sistema</h3>
            <p>Quantidade de eventos por tipo</p>
          </div>
        </div>

        <div class="tabela-scroll">
          <table>
            <thead>
              <tr>
                <th>Tipo de movimentação</th>
                <th>Total</th>
              </tr>
            </thead>

            <tbody>
              <tr v-for="m in movimentacoes" :key="m.tipo_evento">
                <td>{{ m.tipo_evento }}</td>
                <td>{{ m.total }}</td>
              </tr>

              <tr v-if="movimentacoes.length === 0">
                <td colspan="2" class="relatorio-vazio">
                  Nenhuma movimentação registrada.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </template>
  </div>
</template>



  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="/front/app.js"></script>
<script src="/front/ProdutoForm.js"></script>
<script src="/front/ProdutoList.js"></script>
<script src="/front/RelatorioView.js"></script>
<script src="/front/main.js"></script>
  
  <script src="main.js"></script>
</body>
</html>
